<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Heatmap 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      #map { position: fixed; inset: 0; }
      #message, #badge {
        position: fixed; z-index: 2;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      #message { left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0.7; }
      #badge {
        right: 10px; bottom: 8px; text-decoration: none; opacity: 0.55;
        padding: 3px 8px; border-radius: 6px; transition: opacity 0.2s;
      }
      #badge:hover { opacity: 1; }
      #music {
        position: fixed; left: 10px; bottom: 8px; z-index: 2; border: 0; cursor: pointer;
        font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        padding: 8px 12px; border-radius: 999px;
      }
      #music[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="message"></div>
    <button id="music" type="button" hidden></button>
    <a id="badge" target="_blank" rel="noopener" hidden>Open in 3D ↗</a>
    <script type="module" src="/src/embed.js"></script>
  </body>
</html>
